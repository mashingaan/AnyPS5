name: Validate quoted CMake cache values
on:
  push:
    branches:
      - validation/cmake-quoted-value
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare two real CMake caches
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path
          from tools.configure_seed import checks

          cases = [
              ('first', 'A:B', 'abc":INTERNAL=1'),
              ('second', 'A:B":INTERNAL=abc', '1'),
          ]
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              lines = []
              for label, name, value in cases:
                  source = root / label
                  source.mkdir()
                  content = f'cmake_minimum_required(VERSION 3.20)\nproject(cache_probe NONE)\nset([=[{name}]=] [=[{value}]=] CACHE INTERNAL "Test cache probe")\n'
                  (source / 'CMakeLists.txt').write_text(content, encoding='utf-8')
                  subprocess.run(['cmake', '-S', str(source), '-B', str(root / (label + '-build'))], check=True)
                  cache = root / (label + '-build') / 'CMakeCache.txt'
                  entry = next(line for line in cache.read_text().splitlines() if line.startswith('"A:B'))
                  print(label, 'input:', repr((name, value)), 'serialized:', repr(entry), 'parsed:', checks(cache))
                  lines.append(entry)
              if lines[0] != lines[1]:
                  raise SystemExit('the two cache entries are distinguishable')
              print('CMake serialized two distinct name and value pairs identically')
              for label, name, value in cases:
                  cache = root / (label + '-build') / 'CMakeCache.txt'
                  if checks(cache):
                      raise SystemExit('ambiguous cache entry was not skipped')
              print('Both ambiguous cache entries were skipped')
          PY
      - name: Run existing configure seed tests
        run: python -m unittest tools.tests.test_configure_seed
